<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art Gallery - Artists</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <div class="container navbar">
      <a href="index.html" class="logo">Art Gallery</a>
      <ul class="nav-links">
        <li><a href="index.html" data-i18n="nav_home">Главная</a></li>
        <li><a href="collection.html" data-i18n="nav_collection">Коллекция</a></li>
        <li><a href="artists.html" class="active" data-i18n="nav_artists">Художники</a></li>
        <li><a href="about.html" data-i18n="nav_about">О галерее</a></li>
        <li><a href="saved.html" data-i18n="nav_saved">Избранное</a></li>
      </ul>
      <div class="controls">
        <select id="lang-select" class="lang-select">
          <option value="ru">RU</option>
          <option value="en">EN</option>
          <option value="uz">UZ</option>
        </select>
        <button id="theme-toggle" class="btn-control">🌙 Dark</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="page-header">
      <h1 class="page-title" data-i18n="artists_title">Великие художники</h1>
      <p class="page-subtitle" data-i18n="artists_subtitle">Познакомьтесь с творцами мировых шедевров</p>
    </div>

    <div id="artists-grid" class="grid-artists"></div>
  </main>

  <footer>
    <div class="container footer-content">
      <span class="logo">Art Gallery</span>
      <p data-i18n="footer_text">© 2026 Art Gallery. Все права защищены.</p>
    </div>
  </footer>

  <script src="js/theme.js"></script>
  <script src="js/language.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const grid = document.getElementById('artists-grid');
      if (grid) {
        grid.innerHTML = artistsData.map(artist => `
          <div class="card-artist">
            <div class="artist-header">
              <img src="${artist.avatar}" alt="${artist.name}" class="artist-avatar">
              <div>
                <h3 class="artist-name">${artist.name}</h3>
                <span class="artist-years">${artist.years}</span>
              </div>
            </div>
            <p class="artist-bio">${artist.bio}</p>
            <div class="artist-works-title">Известные работы:</div>
            <div class="artist-works-list">${artist.works}</div>
          </div>
        `).join('');
      }
    });
  </script>
</body>
</html>
